name: Daily AI Trading Scan

on:
  schedule:
    # 1. Sesiunea ~15:30 RO (Pregatire piata)
    - cron: '22 12,13 * * 1-5'
    # 2. Sesiunea ~16:15 RO (Scanare Pre-Market, 15 min inainte de deschiderea SUA)
    - cron: '11 13,14 * * 1-5'
    # 3. Sesiunea ~16:45 RO (Confirmare directie si volum dupa primele 15 min)
    - cron: '47 13,14 * * 1-5'
  workflow_dispatch: # Permite pornirea manuala oricand cu un click

concurrency:
  group: trading-scan-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaleaza librariile
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruleaza analiza pietelor si trimite alerte
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python analyzer.py

      - name: Salveaza rezultatele in data.json
        run: |
          git config --local user.email "bot@trading-analyst.local"
          git config --local user.name "AI Trading Bot"
          git pull --rebase origin main || true
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update market analysis" && git push)
